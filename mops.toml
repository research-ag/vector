[package]
name = "vector"
version = "0.4.7"
description = "Memory-efficient resizable array (replaces Buffer)"
repository = "https://github.com/research-ag/vector"
keywords = [ "array", "buffer", "resize", "optimized" ]
license = "Apache-2.0"

[dependencies]
base = "0.16.0"

[dev-dependencies]
core = "2.6.2"
bench-helper = "0.0.3"
matchers = "2.1.0"

[toolchain]
moc = "2.0.0"
pocket-ic = "15.0.0"
wasm-opt = "133"

[requirements]
moc = "0.14.13"

[optimize]
